<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1018"/>
      <stop offset="50%" stop-color="#213147"/>
      <stop offset="100%" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12AAFF"/>
      <stop offset="50%" stop-color="#9DCCED"/>
      <stop offset="100%" stop-color="#12AAFF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12AAFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#12AAFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <g opacity="0.04" stroke="#12AAFF" stroke-width="0.5" fill="none">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>

  <ellipse cx="640" cy="0" rx="500" ry="200" fill="url(#glow)"/>

  <rect x="0" y="0" width="1280" height="2" fill="url(#accent)" opacity="0.6"/>
  <rect x="0" y="318" width="1280" height="2" fill="url(#accent)" opacity="0.3"/>

  <text x="640" y="120" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">
    Stylus Scoring Engine
  </text>

  <text x="640" y="170" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="400" fill="#9DCCED">
    Verifiable compute for production scoring systems on Arbitrum
  </text>

  <g transform="translate(640, 220)" text-anchor="middle"
     font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace"
     font-size="13" font-weight="500">

    <rect x="-270" y="-16" width="70" height="30" rx="15" fill="#12AAFF" fill-opacity="0.12" stroke="#12AAFF" stroke-opacity="0.25"/>
    <text x="-235" y="5" fill="#12AAFF">Rust</text>

    <rect x="-180" y="-16" width="80" height="30" rx="15" fill="#12AAFF" fill-opacity="0.12" stroke="#12AAFF" stroke-opacity="0.25"/>
    <text x="-140" y="5" fill="#12AAFF">Stylus</text>

    <rect x="-80" y="-16" width="85" height="30" rx="15" fill="#12AAFF" fill-opacity="0.12" stroke="#12AAFF" stroke-opacity="0.25"/>
    <text x="-37" y="5" fill="#12AAFF">Arbitrum</text>

    <rect x="25" y="-16" width="70" height="30" rx="15" fill="#12AAFF" fill-opacity="0.12" stroke="#12AAFF" stroke-opacity="0.25"/>
    <text x="60" y="5" fill="#12AAFF">Axum</text>

    <rect x="115" y="-16" width="75" height="30" rx="15" fill="#12AAFF" fill-opacity="0.12" stroke="#12AAFF" stroke-opacity="0.25"/>
    <text x="153" y="5" fill="#12AAFF">SQLite</text>

    <rect x="210" y="-16" width="70" height="30" rx="15" fill="#12AAFF" fill-opacity="0.12" stroke="#12AAFF" stroke-opacity="0.25"/>
    <text x="245" y="5" fill="#12AAFF">alloy</text>
  </g>
</svg>
